<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A simple To-Do List application built with JavaScript.">
    <meta name="author" content="Aashish Borde">

    <title>To-Do List | Aashish Borde</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <nav aria-label="Main Navigation">

            <h1>Aashish Borde</h1>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <button
                type="button"
                id="theme-toggle"
                aria-label="Toggle dark mode">
                🌙 Dark Mode
            </button>

        </nav>
    </header>


    <!-- Main Content -->
    <main>

        <section aria-labelledby="todo-title">

            <h2 id="todo-title">My To-Do List</h2>

            <p>Manage your daily tasks easily.</p>

            <!-- Add Task -->
            <form id="todo-form">

                <label for="task-input">Enter Task</label>

                <input
                    type="text"
                    id="task-input"
                    placeholder="Enter your task"
                    required>

                <button type="submit">
                    Add Task
                </button>

            </form>


            <!-- Filters -->
            <div class="todo-filters" aria-label="Task filters">

                <button type="button" data-filter="all">
                    All
                </button>

                <button type="button" data-filter="active">
                    Active
                </button>

                <button type="button" data-filter="completed">
                    Completed
                </button>

            </div>


            <!-- Task List -->
            <ul id="task-list" aria-live="polite">
                <!-- Tasks will be added using JavaScript -->
            </ul>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Aashish Borde. All Rights Reserved.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
